services:
  app:
    build:
      context: .                    # folder containing your Dockerfile
      dockerfile: Dockerfile         # explicit, in case you have multiple
    ports:
      - "3000:3000"                  # expose Next.js to your machine
    environment:
      - DATABASE_URL=postgresql://myuser:mypass@db:5432/mydb?schema=public
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy   # wait for Postgres to be READY, not just started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypass
      - POSTGRES_DB=mydb
    volumes:
      - db_data:/var/lib/postgresql/data   # persists DB data across restarts
    ports:
      - "5432:5432"                 # optional — lets you connect via a local GUI tool (e.g. Prisma Studio, TablePlus)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:                          # declared here so Compose manages it, survives `down` (not `down -v`)